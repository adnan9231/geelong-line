<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Geelong Line">
<meta name="theme-color" content="#0e0b14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Geelong Line</title>
<style>
  :root{
    --bg:#0e0b14; --card:#1a1622; --card2:#241e2f; --line:#2e2839;
    --text:#f4f1f8; --muted:#9a93a8; --accent:#c06ad8; --accent2:#8f1a95;
    --ok:#3ddc97; --late:#ffb547; --bad:#ff5d6c; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px);max-width:560px;margin:0 auto;min-height:100vh}
  button,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
  .top h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:750}
  .top h1 small{display:block;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
  .iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center}
  .iconbtn svg{width:20px;height:20px;stroke:var(--text)}
  .spin svg{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:14px;padding:4px;gap:4px}
  .seg button{padding:10px 6px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
  .seg button.on{background:var(--accent2);color:#fff}
  .seg.small button{padding:8px 4px;font-size:14px}
  .seg.small button.on{background:var(--card2);color:var(--text)}

  .station{margin-top:12px;background:var(--card);border-radius:var(--r);padding:12px 16px;position:relative}
  .station small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .station .nm{font-size:22px;font-weight:700;display:flex;align-items:center;gap:6px}
  .station .nm::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);margin-left:4px}
  .station select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
  .dir{margin-top:10px}

  .banner{margin-top:12px;background:#2a1c10;border:1px solid #4a3218;color:#ffd9a3;border-radius:14px;padding:12px 14px;font-size:14px}
  .banner b{display:block;margin-bottom:2px;color:#ffc46b}
  .banner details summary{list-style:none;cursor:pointer} .banner details summary::-webkit-details-marker{display:none}
  .banner .d{margin-top:8px;color:#e9c79a;font-size:13px} .banner a{color:#ffc46b}
  .err{background:#2b1218;border-color:#53202b;color:#ffb3bc} .err b{color:#ff8b98}
  .info{background:#191527;border-color:#2e2650;color:#c9c0ea} .info b{color:#d9cfff}

  h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 4px 8px;font-weight:600}
  .list{background:var(--card);border-radius:var(--r);overflow:hidden}
  .empty{padding:28px 18px;text-align:center;color:var(--muted)}
  .more{display:block;width:100%;padding:14px;color:var(--accent);font-weight:600;border-top:1px solid var(--line)}

  /* timetable rows */
  .tt{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
  .tt:first-child{border-top:0}
  .tt .t{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .tt .dst{font-size:15px} .tt .dst small{display:block;color:var(--muted);font-size:13px}
  .tt .pl{color:var(--muted);font-size:13px;text-align:right}
  .tt .pl b{display:block;color:var(--text);font-size:17px}
  .day{padding:8px 16px;background:var(--card2);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

  /* live */
  .hero{margin-top:16px;background:linear-gradient(145deg,#3a1544,#1d1426 70%);border-radius:24px;padding:20px;position:relative;cursor:pointer}
  .hero .lbl{padding-right:92px;font-size:13px;color:#d8c4e2;text-transform:uppercase;letter-spacing:.08em}
  .hero .big{font-size:64px;font-weight:780;letter-spacing:-.04em;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
  .hero .big small{font-size:24px;font-weight:600;letter-spacing:0;margin-left:4px;color:#e6d6ee}
  .hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:#eadff0;font-size:15px;margin-top:10px}
  .hero .meta b{font-weight:650}
  .plat{position:absolute;right:18px;top:18px;text-align:center;background:rgba(255,255,255,.1);border-radius:16px;padding:8px 12px;min-width:64px}
  .plat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#d8c4e2}
  .plat b{font-size:28px;font-weight:750}
  .where{margin-top:12px;font-size:14px;color:#e6d6ee;display:flex;align-items:center;gap:8px}
  .where::before{content:"🚆"}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .pill.live{background:rgba(61,220,151,.14);color:var(--ok)}
  .pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
  .pill.sched{background:rgba(255,255,255,.08);color:var(--muted)}
  .pill.late{background:rgba(255,181,71,.14);color:var(--late)}
  .pill.cancel{background:rgba(255,93,108,.16);color:var(--bad)}
  @keyframes pulse{50%{opacity:.3}}

  .row{border-top:1px solid var(--line)} .row:first-child{border-top:0}
  .row > button{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:13px 14px;width:100%;text-align:left}
  .row .t{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .row .t s{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .row .a{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .b{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row .in{text-align:right;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .row .in small{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .row.cx .t,.row.cx .a{text-decoration:line-through;color:var(--muted)}

  /* stopping pattern */
  .pat{padding:4px 16px 14px 22px}
  .ps{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;position:relative;padding:5px 0;font-size:14px}
  .ps::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
  .ps:first-child::before{top:50%} .ps:last-child::before{bottom:50%}
  .ps i{width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--muted);position:relative;z-index:1;margin-left:3px}
  .ps.past{color:var(--muted)} .ps.past i{background:var(--muted);border-color:var(--muted)}
  .ps.here i{background:var(--accent);border-color:var(--accent)} .ps.here{font-weight:700}
  .ps .tm{font-variant-numeric:tabular-nums;color:var(--muted)} .ps .tm b{color:var(--late);font-weight:600}
  .ps.trainpos{color:var(--ok);font-size:13px;font-weight:600}
  .ps.trainpos i{border:0;background:none;width:18px;height:18px;margin:0;display:grid;place-items:center;font-style:normal}

  .foot{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
  .skel{height:150px;border-radius:24px;margin-top:16px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:10}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#16121d;border-radius:22px 22px 0 0;
    padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .25s ease;z-index:11;max-height:88vh;overflow:auto;visibility:hidden}
  .sheet.on{transform:none;visibility:visible}
  .grab{width:40px;height:5px;border-radius:3px;background:#3a3446;margin:0 auto 12px}
  .sheet h3{margin:0 0 12px;font-size:20px}
  .field{display:block;margin-bottom:12px} .field small{display:block;color:var(--muted);font-size:13px;margin:0 0 6px 2px}
  input{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
  input:focus{border-color:var(--accent)}
  .btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent2);color:#fff;font-weight:650;margin-top:8px}
  .btn.ghost{background:var(--card);color:var(--text)}
  .note{font-size:13px;color:var(--muted);margin:10px 2px}
  .msg{font-size:14px;margin-top:10px} .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-top:1px solid var(--line);margin-top:6px}
  .toggle input{width:auto;transform:scale(1.3)}

  .trip{margin-top:12px;background:var(--card);border-radius:var(--r);padding:4px 6px 4px 16px;display:flex;align-items:center;gap:10px}
  .trip .stops{flex:1;min-width:0}
  .sp{position:relative;padding:9px 0}
  .sp small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .sp .nm{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .sp .nm::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);margin-left:4px}
  .sp select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
  .trip hr{border:0;border-top:1px solid var(--line);margin:0}
  .swap{width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
  .swap svg{width:22px;height:22px;stroke:var(--accent)}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
  .chip.on{background:var(--accent2);color:#fff}
  .chip.add{color:var(--accent)}
  .chip .x{opacity:.7;font-size:16px;line-height:1}
  .tt .arr{font-size:15px} .tt .arr small{display:block;color:var(--muted);font-size:13px}
  .stat{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-top:1px solid var(--line);font-size:15px}
  .stat span:last-child{color:var(--muted);text-align:right}
  .pill.coach{background:rgba(120,170,255,.14);color:#9cc0ff}
</style>
</head>
<body>

<div class="top">
  <h1>Geelong Line<small>V/Line · Southern Cross ↔ Waurn Ponds</small></h1>
  <div style="display:flex;gap:8px">
    <button class="iconbtn" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button class="iconbtn" id="settingsBtn" aria-label="Info"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </div>
</div>

<div class="seg" id="modeSeg">
  <button data-m="live">Live</button>
  <button data-m="tt">Timetable</button>
</div>

<div class="trip">
  <div class="stops">
    <div class="sp"><small>From</small><div class="nm" id="fromName">…</div><select id="fromSel" aria-label="Departure station"></select></div>
    <hr>
    <div class="sp"><small>To</small><div class="nm" id="toName">…</div><select id="toSel" aria-label="Arrival station"></select></div>
  </div>
  <button class="swap" id="swapBtn" aria-label="Swap stations"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4"/><path d="M17 20V4M17 20l-4-4M17 20l4-4"/></svg></button>
</div>

<div class="chips" id="chips"></div>
<div id="alerts"></div>
<div id="main"></div>
<div class="foot" id="foot"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="setSheet">
  <div class="grab"></div>
  <h3>Data status</h3>
  <div id="statusList"></div>
  <div class="toggle"><span>Demo mode (sample data)</span><input type="checkbox" id="demoToggle"></div>
  <p class="note">Timetable and live data: Transport Victoria Open Data (GTFS Schedule and GTFS Realtime), licensed under Creative Commons Attribution 4.0.</p>
  <button class="btn ghost" id="closeSet">Close</button>
</div>

<script>
(() => {
'use strict';
// ▼▼ Paste your Cloudflare Worker address between the quotes, e.g. 'https://geelong-line-api.yourname.workers.dev'
const DATA_SERVER = '';
// ▲▲ Without it, the app still shows the timetable, just not live times.
const TZ = 'Australia/Melbourne';
const LIVE_REFRESH = 30000;
const $ = id => document.getElementById(id);

/* ---------- state ---------- */
const store = {
  get(k,d){ try{ const v = localStorage.getItem('gl.'+k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem('gl.'+k, JSON.stringify(v)); }catch{} }
};
let st = store.get('st2', { mode:'live', from:'Tarneit', to:'Southern Cross' });
let saved = store.get('saved', [{ from:'Tarneit', to:'Southern Cross' }, { from:'Southern Cross', to:'Tarneit' }]);
let demoPref = store.get('demo', false);
let TT = null, ttDemo = false, ttErr = null;        // timetable
let RT = null, rtAt = null, rtErr = null;           // realtime: Map trip_id -> update
let data = null, loading = false, pages = 0, openRun = null, lastUpdated = null;
const save = () => store.set('st2', st);
const isDemo = () => demoPref || ttDemo;

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',timeZone:TZ}).replace(/\s?(am|pm)/i, m => m.trim().toLowerCase());
const dayKey = d => d.toLocaleDateString('en-AU',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const dayLabel = d => { const k = dayKey(d); if (k === dayKey(new Date())) return 'Today'; if (k === dayKey(new Date(Date.now()+864e5))) return 'Tomorrow';
  return d.toLocaleDateString('en-AU',{timeZone:TZ,weekday:'long',day:'numeric',month:'short'}); };
const mins = d => Math.round((d - Date.now())/60000);
const same = (a,b) => String(a).toLowerCase() === String(b).toLowerCase();

// Melbourne local time <-> real instants (handles daylight saving)
const dtf = new Intl.DateTimeFormat('en-AU',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'});
function parts(date){ const o = {}; dtf.formatToParts(date).forEach(p => o[p.type] = +p.value); return o; }
function offsetMin(date){ const p = parts(date); return Math.round((Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute) - Math.floor(date.getTime()/60000)*60000)/60000); }
function melb(ymd, minutes){
  const y = Math.floor(ymd/10000), m = Math.floor(ymd/100)%100, d = ymd%100;
  const wall = Date.UTC(y, m-1, d, 0, 0) + minutes*60000;
  const t1 = wall - offsetMin(new Date(wall))*60000;
  return new Date(wall - offsetMin(new Date(t1))*60000);
}
function todayYmd(){ const p = parts(new Date()); return p.year*10000 + p.month*100 + p.day; }
function addDays(ymd, n){ const d = new Date(Date.UTC(Math.floor(ymd/10000), Math.floor(ymd/100)%100-1, ymd%100) + n*864e5);
  return d.getUTCFullYear()*10000 + (d.getUTCMonth()+1)*100 + d.getUTCDate(); }

/* ---------- timetable ---------- */
async function loadTimetable(){
  if (TT && !ttDemo && !demoPref) return;
  ttDemo = false; ttErr = null;
  if (demoPref){ TT = demoTimetable(); return; }
  try{
    const r = await fetch('timetable.json', { cache:'no-cache' });
    if (!r.ok) throw new Error(r.status === 404 ? 'timetable.json not found yet' : 'HTTP ' + r.status);
    TT = await r.json();
  }catch(e){ ttErr = e.message; ttDemo = true; TT = demoTimetable(); }
  prepTT();
}
function prepTT(){
  TT.svcSets = TT.services.map(a => new Set(a));
  TT.trips.forEach(t => { t.pos = new Map(); t[4].forEach((s,k) => { if (!t.pos.has(s[0])) t.pos.set(s[0], k); }); });
}
const stIdx = name => TT.stations.findIndex(n => same(n, name));

function journeys(fromName, toName, horizonDays){
  const a = stIdx(fromName), b = stIdx(toName), out = [];
  if (a < 0 || b < 0 || a === b) return out;
  const t0 = todayYmd();
  for (let k = -1; k <= horizonDays; k++){
    const day = addDays(t0, k);
    TT.trips.forEach(t => {
      if (!TT.svcSets[t[1]].has(day)) return;
      const i = t.pos.get(a), j = t.pos.get(b);
      if (i === undefined || j === undefined || j <= i) return;
      out.push({ t, id: t[0], day, i, j, sched: melb(day, t[4][i][1]), arrSched: melb(day, t[4][j][1]),
        plat: t[4][i][3], head: t[2], coach: !!t[3] });
    });
  }
  return out.sort((x,y) => x.sched - y.sched);
}

/* ---------- realtime (GTFS-R protobuf, decoded here) ---------- */
function pb(buf){
  let p = 0;
  const varint = () => { let r = 0n, s = 0n, b; do { b = buf[p++]; r |= BigInt(b & 0x7f) << s; s += 7n; } while (b & 0x80); return r; };
  const fields = (end, cb) => { while (p < end){ const key = Number(varint()), f = key >> 3, w = key & 7;
    if (w === 0) cb(f, 0, varint());
    else if (w === 2){ const len = Number(varint()), s = p; p += len; cb(f, 2, s, s+len); }
    else if (w === 1){ p += 8; } else if (w === 5){ p += 4; } else throw new Error('bad protobuf'); } };
  const str = (s,e) => new TextDecoder().decode(buf.subarray(s,e));
  const sub = (s, e, fn) => { const save = p; p = s; fn(e); p = save; };
  const map = new Map();
  fields(buf.length, (f, w, a, b) => {
    if (f !== 2 || w !== 2) return;                         // FeedMessage.entity
    sub(a, b, end => fields(end, (f2, w2, a2, b2) => {
      if (f2 !== 3 || w2 !== 2) return;                     // FeedEntity.trip_update
      const tu = { id:null, date:null, cancelled:false, stops:[] };
      sub(a2, b2, end2 => fields(end2, (f3, w3, a3, b3) => {
        if (f3 === 1 && w3 === 2) sub(a3, b3, e => fields(e, (f4, w4, a4, b4) => {   // TripDescriptor
          if (f4 === 1) tu.id = str(a4, b4);
          else if (f4 === 3) tu.date = +str(a4, b4);
          else if (f4 === 4 && w4 === 0) tu.cancelled = Number(a4) === 3;
        }));
        else if (f3 === 2 && w3 === 2){                      // StopTimeUpdate
          const u = { seq:null, stop:null, skip:false };
          sub(a3, b3, e => fields(e, (f4, w4, a4, b4) => {
            if (f4 === 1 && w4 === 0) u.seq = Number(a4);
            else if ((f4 === 2 || f4 === 3) && w4 === 2){
              const ev = {};
              sub(a4, b4, e2 => fields(e2, (f5, w5, v) => {
                if (f5 === 1 && w5 === 0) ev.delay = Number(BigInt.asIntN(32, v));
                else if (f5 === 2 && w5 === 0) ev.time = Number(BigInt.asIntN(64, v));
              }));
              u[f4 === 2 ? 'arr' : 'dep'] = ev;
            }
            else if (f4 === 4 && w4 === 2) u.stop = str(a4, b4);
            else if (f4 === 5 && w4 === 0) u.skip = Number(a4) === 1;
          }));
          tu.stops.push(u);
        }
      }));
      if (tu.id) map.set(tu.id, tu);
    }));
  });
  return map;
}
async function loadRealtime(){
  rtErr = null;
  if (isDemo()){ RT = demoRealtime(); rtAt = new Date(); return; }
  if (!DATA_SERVER){ RT = null; return; }
  try{
    const r = await fetch(DATA_SERVER.replace(/\/+$/,'') + '/realtime', { cache:'no-store' });
    if (!r.ok){ let m = 'HTTP ' + r.status; try{ const j = await r.json(); if (j.message) m = j.message; }catch{} throw new Error(m); }
    RT = pb(new Uint8Array(await r.arrayBuffer())); rtAt = new Date();
  }catch(e){ rtErr = e.message === 'Failed to fetch' ? 'Can’t reach the live data server.' : e.message; }
}
// live estimates for every stop of one journey's train
function applyRT(x){
  x.stopsRT = null; x.est = null; x.arrEst = null; x.cx = false; x.skipFrom = x.skipTo = false; x.live = false;
  if (!RT) return;
  const u = RT.get(x.id);
  if (!u || (u.date && u.date !== x.day)) return;
  x.live = true; x.cx = u.cancelled;
  const stops = x.t[4], est = new Array(stops.length).fill(null), skip = new Array(stops.length).fill(false);
  let delay = null;
  stops.forEach((s, k) => {
    const upd = u.stops.find(v => (v.stop != null && TT.stopIds && TT.stopIds[v.stop] === s[0]) || (v.seq != null && v.seq === s[2]));
    const sched = melb(x.day, s[1]);
    if (upd){
      if (upd.skip){ skip[k] = true; return; }
      const ev = upd.dep || upd.arr || {};
      if (ev.time){ est[k] = new Date(ev.time*1000); delay = (est[k] - sched)/1000; }
      else if (ev.delay != null){ delay = ev.delay; est[k] = new Date(sched.getTime() + delay*1000); }
      else if (delay != null) est[k] = new Date(sched.getTime() + delay*1000);
    } else if (delay != null) est[k] = new Date(sched.getTime() + delay*1000);
  });
  x.stopsRT = { est, skip };
  x.est = est[x.i]; x.arrEst = est[x.j]; x.skipFrom = skip[x.i]; x.skipTo = skip[x.j];
  if (x.skipFrom || x.skipTo) x.cx = true;
}

/* ---------- demo data ---------- */
function demoTimetable(){
  const LINE = ['Southern Cross','Footscray','Sunshine','Deer Park','Tarneit','West Tarneit','Wyndham Vale','Little River','Lara','Corio','North Shore','North Geelong','Geelong','South Geelong','Marshall','Waurn Ponds'];
  const RTm = [0,7,13,21,28,31,34,41,48,52,55,58,62,65,70,75];
  const t0 = todayYmd(), days = [-1,0,1,2,3].map(k => addDays(t0, k));
  const trips = []; let k = 0;
  for (let s = 5*60; s < 24*60; s += 20) for (const up of [true,false]){
    k++; const endG = !up && k % 3 === 0;
    const idx = up ? [...Array(16).keys()].reverse() : [...Array(endG ? 13 : 16).keys()];
    trips.push(['demo'+k, 0, up ? 'Southern Cross' : (endG ? 'Geelong' : 'Waurn Ponds'), k % 23 === 0 ? 1 : 0,
      idx.map((i, q) => [i, s + (up ? RTm[15]-RTm[i] : RTm[i]), q+1, up ? '1' : '2'])]);
  }
  return { generated: new Date().toISOString(), from: days[0], to: days[4], stations: LINE, stopIds: {}, services: [days], trips, demo:true };
}
function demoRealtime(){
  const m = new Map(), now = Date.now(), t0 = todayYmd(); let n = 0;
  TT.trips.forEach(t => {
    const dep = melb(t0, t[4][0][1]), end = melb(t0, t[4][t[4].length-1][1]);
    if (end < now - 60*60000 || dep > now + 100*60000) return;
    const d = [180, 0, 0, 360, 0, 60][n++ % 6];
    m.set(t[0], { id:t[0], date:t0, cancelled: n === 4, stops:[{ seq:1, stop:null, dep:{ delay:d } }] });
  });
  return m;
}

/* ---------- build the list ---------- */
function compute(){
  if (!TT) return null;
  const live = st.mode === 'live';
  const want = live ? 8 + pages*8 : 20 + pages*20;
  const now = Date.now();
  const all = journeys(st.from, st.to, live ? 1 : 3 + pages*3);
  all.forEach(x => { applyRT(x); x.when = (live && x.est) || x.sched; });
  const list = all.filter(x => x.when.getTime() > now - 60000).sort((a,b) => a.when - b.when);
  return { list: list.slice(0, want), more: list.length > want || !live };
}

/* ---------- render ---------- */
function pill(x){
  if (x.cx) return `<span class="pill cancel">${x.skipFrom ? 'Not stopping here' : x.skipTo ? 'Not stopping at ' + esc(st.to) : 'Cancelled'}</span>`;
  if (!x.live || !x.est) return '<span class="pill sched">Scheduled</span>';
  const d = Math.round((x.est - x.sched)/60000);
  return d >= 2 ? `<span class="pill late">${d} min late</span>` : '<span class="pill live">On time</span>';
}
const arrOf = (x, live) => (live && x.arrEst) || x.arrSched;
const durOf = (x, live) => Math.round((arrOf(x, live) - ((live && x.est) || x.sched))/60000);
const coachTag = x => x.coach ? '<span class="pill coach">Replacement coach</span>' : '';
const tripKey = t => t.from.toLowerCase() + '>' + t.to.toLowerCase();

function renderControls(){
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === st.mode));
  $('fromName').textContent = st.from; $('toName').textContent = st.to;
  if (TT){
    const opts = sel => TT.stations.map(n => `<option ${same(n, sel) ? 'selected' : ''}>${esc(n)}</option>`).join('');
    $('fromSel').innerHTML = opts(st.from); $('toSel').innerHTML = opts(st.to);
  }
  const cur = tripKey(st);
  let h = saved.map((t,i) => `<button class="chip${tripKey(t) === cur ? ' on' : ''}" data-i="${i}">${esc(t.from)} → ${esc(t.to)}${tripKey(t) === cur ? '<span class="x" data-del="'+i+'" aria-label="Remove">×</span>' : ''}</button>`).join('');
  if (!saved.some(t => tripKey(t) === cur)) h += `<button class="chip add" id="saveTrip">☆ Save this trip</button>`;
  $('chips').innerHTML = h;
  $('chips').querySelectorAll('[data-i]').forEach(b => b.onclick = e => {
    const del = e.target.closest('[data-del]');
    if (del){ saved.splice(+del.dataset.del, 1); store.set('saved', saved); renderControls(); return; }
    const t = saved[+b.dataset.i]; st.from = t.from; st.to = t.to; save(); reset();
  });
  const s = $('saveTrip'); if (s) s.onclick = () => { saved.push({ from: st.from, to: st.to }); store.set('saved', saved); renderControls(); };
}
function render(){
  renderControls();
  const al = [];
  if (demoPref) al.push(`<div class="banner info"><b>Demo mode</b>Showing sample trains. Turn it off in ⚙︎.</div>`);
  else if (ttDemo) al.push(`<div class="banner info"><b>Timetable not set up yet</b>Showing sample trains until the “Update timetable” GitHub Action has run (${esc(ttErr || '')}).</div>`);
  if (st.mode === 'live' && !isDemo()){
    if (!DATA_SERVER) al.push(`<div class="banner info"><b>Live times not connected</b>Showing timetabled times. Add your Cloudflare address to connect live data.</div>`);
    else if (rtErr) al.push(`<div class="banner err"><b>Live data unavailable</b>${esc(rtErr)} Showing timetabled times.</div>`);
  }
  $('alerts').innerHTML = al.join('');

  const m = $('main');
  if (same(st.from, st.to)){ m.innerHTML = `<div class="list" style="margin-top:16px"><div class="empty">Pick two different stations.</div></div>`; foot(); return; }
  if (!data){ m.innerHTML = loading ? '<div class="skel"></div>' : ''; foot(); return; }
  if (!data.list.length){ m.innerHTML = `<div class="list" style="margin-top:16px"><div class="empty">No upcoming trains from ${esc(st.from)} to ${esc(st.to)}.</div></div>`; foot(); return; }
  m.innerHTML = st.mode === 'tt' ? renderTT() : renderLive();
  const mb = $('moreBtn'); if (mb) mb.onclick = () => { pages++; data = compute(); render(); };
  m.querySelectorAll('[data-run]').forEach(b => b.onclick = () => { openRun = openRun === b.dataset.run ? null : b.dataset.run; render(); });
  foot();
}
function renderTT(){
  let h = `<h2>${esc(st.from)} → ${esc(st.to)}</h2><div class="list">`, lastDay = '';
  data.list.forEach((x,k) => {
    const dl = dayLabel(x.sched);
    if (dl !== lastDay){ if (k || dl !== 'Today') h += `<div class="day">${esc(dl)}</div>`; lastDay = dl; }
    const between = x.j - x.i - 1;
    h += `<div class="tt"><div class="t">${fmt(x.sched)}</div>
      <div class="arr">Arr ${fmt(x.arrSched)}<small>${durOf(x,false)} min · ${between ? between + ' stop' + (between > 1 ? 's' : '') : 'direct'}${x.coach ? ' · coach' : ''}</small></div>
      <div class="pl">${x.plat ? `Plat<b>${esc(x.plat)}</b>` : ''}</div></div>`;
  });
  if (data.more) h += `<button class="more" id="moreBtn">Show more</button>`;
  return h + '</div>';
}
function cdown(d){ const m = mins(d); if (m <= 0) return ['Now','']; if (m < 60) return [m,'min']; return [Math.floor(m/60)+'h', m%60 ? (m%60)+'m' : '']; }
const key = x => x.id + '@' + x.day;
function renderLive(){
  const first = data.list.find(x => !x.cx) || data.list[0];
  const [n,u] = cdown(first.when);
  let h = `<div class="hero" data-run="${esc(key(first))}">
    ${first.plat ? `<div class="plat"><small>Platform</small><b>${esc(first.plat)}</b></div>` : ''}
    <div class="lbl">Next train to ${esc(st.to)}</div>
    <div class="big">${n}${u ? `<small>${u}</small>` : ''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${pill(first)}${coachTag(first)}</div>
    <div class="meta"><span>Departs <b>${fmt(first.when)}</b>${first.est && Math.abs(first.est-first.sched) >= 120000 ? ` <s style="opacity:.6">${fmt(first.sched)}</s>` : ''}</span>
      <span>Arrives <b>${fmt(arrOf(first,true))}</b></span><span>${durOf(first,true)} min</span><span>to ${esc(first.head)}</span></div>
    ${wherePill(first)}
    ${openRun === key(first) ? patternHTML(first) : ''}
  </div><h2>Following trains</h2><div class="list">`;
  const rest = data.list.filter(x => x !== first);
  if (!rest.length) h += `<div class="empty">No more trains found.</div>`;
  rest.forEach(x => {
    const m = mins(x.when), late = x.est ? Math.round((x.est - x.sched)/60000) : 0;
    h += `<div class="row${x.cx ? ' cx':''}"><button data-run="${esc(key(x))}">
      <div class="t">${fmt(x.when)}${late >= 2 ? `<s>${fmt(x.sched)}</s>` : ''}</div>
      <div><div class="a">Arr ${fmt(arrOf(x,true))} · ${durOf(x,true)} min</div><div class="b">${pill(x)}${coachTag(x)}${x.plat ? `<span>Plat ${esc(x.plat)}</span>` : ''}</div></div>
      <div class="in">${x.cx ? '—' : m <= 0 ? 'Now' : m < 60 ? `${m}<small>min</small>` : `${Math.floor(m/60)}h ${m%60}<small>&nbsp;</small>`}</div>
    </button>${openRun === key(x) ? patternHTML(x) : ''}</div>`;
  });
  if (data.more) h += `<button class="more" id="moreBtn">Show more</button>`;
  return h + '</div>';
}
function stopTimes(x){
  return x.t[4].map((s,k) => ({ name: TT.stations[s[0]], sched: melb(x.day, s[1]),
    est: x.stopsRT ? x.stopsRT.est[k] : null, skip: x.stopsRT ? x.stopsRT.skip[k] : false }));
}
function trainPosition(p){ const now = Date.now(); let last = -1; p.forEach((s,i) => { if (!s.skip && (s.est || s.sched).getTime() <= now) last = i; }); return last; }
function wherePill(x){
  if (x.cx) return '';
  const p = stopTimes(x), i = trainPosition(p);
  const txt = i < 0 ? `Not started yet · leaves ${esc(p[0].name)} at ${fmt(p[0].est || p[0].sched)}`
    : i >= p.length - 1 ? `Arrived at ${esc(p[p.length-1].name)}` : `Now between ${esc(p[i].name)} and ${esc(p[i+1].name)}${x.live ? '' : ' (by timetable)'}`;
  return `<div class="where">${txt}${openRun === key(x) ? '' : ' · tap for stops'}</div>`;
}
function patternHTML(x){
  const p = stopTimes(x), pos = trainPosition(p);
  let h = '<div class="pat">';
  p.forEach((s,i) => {
    const t = s.est || s.sched, late = s.est ? Math.round((s.est - s.sched)/60000) : 0;
    const mine = same(s.name, st.from) || same(s.name, st.to);
    h += `<div class="ps ${i <= pos ? 'past' : ''} ${mine ? 'here' : ''}"><i></i><span>${esc(s.name)}${s.skip ? ' · not stopping' : ''}</span><span class="tm">${s.skip ? '—' : fmt(t)}${!s.skip && late >= 2 ? ` <b>+${late}</b>` : ''}</span></div>`;
    if (i === pos && i < p.length - 1 && !x.cx) h += `<div class="ps trainpos"><i>🚆</i><span>Train is here${x.live ? '' : ' (by timetable)'}</span><span></span></div>`;
  });
  return h + '</div>';
}
function foot(){
  if (!lastUpdated){ $('foot').textContent = ''; return; }
  const live = st.mode === 'live' && rtAt && !rtErr && RT;
  $('foot').textContent = `Updated ${fmt(lastUpdated)}` + (st.mode === 'live' ? (live ? ' · live · refreshes every 30s' : ' · timetabled times') : '') + (isDemo() ? ' · demo data' : ' · Source: Transport Victoria');
}
function renderStatus(){
  const rows = [];
  if (TT && !TT.demo){
    const f = n => { const s = String(n); return `${s.slice(6)}/${s.slice(4,6)}`; };
    rows.push(['Timetable', `${TT.trips.length} trains · ${f(TT.from)} to ${f(TT.to)}`]);
    rows.push(['Timetable updated', new Date(TT.generated).toLocaleString('en-AU',{timeZone:TZ, dateStyle:'medium', timeStyle:'short'})]);
  } else rows.push(['Timetable', ttDemo ? 'Not set up yet (sample data)' : 'Sample data']);
  rows.push(['Live data', isDemo() ? 'Sample data' : !DATA_SERVER ? 'Not connected' : rtErr ? 'Error: ' + rtErr : rtAt ? `Connected · ${RT ? RT.size : 0} trains reporting` : 'Connecting…']);
  $('statusList').innerHTML = rows.map(r => `<div class="stat"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('');
}

/* ---------- refresh ---------- */
async function refresh(full){
  if (loading) return;
  loading = true; $('refreshBtn').classList.add('spin'); render();
  if (full) TT = null;
  await loadTimetable();
  if (!TT.stations.some(n => same(n, st.from))) st.from = 'Tarneit';
  if (!TT.stations.some(n => same(n, st.to)) || same(st.to, st.from)) st.to = same(st.from, 'Southern Cross') ? 'Tarneit' : 'Southern Cross';
  if (st.mode === 'live') await loadRealtime();
  data = compute(); lastUpdated = new Date();
  loading = false; $('refreshBtn').classList.remove('spin'); render();
}
function reset(){ pages = 0; openRun = null; data = TT ? compute() : null; render(); if (st.mode === 'live' && !rtAt) refresh(); }

setInterval(() => { if (st.mode === 'live' && document.visibilityState === 'visible') refresh(); }, LIVE_REFRESH);
setInterval(() => { if (TT && !loading){ data = compute(); render(); } }, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });

/* ---------- controls ---------- */
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { st.mode = b.dataset.m; save(); reset(); });
$('fromSel').onchange = e => { st.from = e.target.value; if (same(st.from, st.to)) st.to = same(st.from,'Southern Cross') ? 'Tarneit' : 'Southern Cross'; save(); reset(); };
$('toSel').onchange = e => { st.to = e.target.value; save(); reset(); };
$('swapBtn').onclick = () => { [st.from, st.to] = [st.to, st.from]; save(); reset(); };
$('refreshBtn').onclick = () => refresh(true);
function openSheet(){ renderStatus(); $('demoToggle').checked = demoPref; $('scrim').classList.add('on'); $('setSheet').classList.add('on'); }
function closeSheet(){ $('scrim').classList.remove('on'); $('setSheet').classList.remove('on'); }
$('scrim').onclick = closeSheet; $('closeSet').onclick = closeSheet;
$('settingsBtn').onclick = openSheet;
$('demoToggle').onchange = e => { demoPref = e.target.checked; store.set('demo', demoPref); RT = null; rtAt = null; refresh(true).then(renderStatus); };

refresh();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
