name: Update timetable

on:
  schedule:
    - cron: '23 17 * * *'     # every day ~4:23am Melbourne time
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build timetable.json from Transport Victoria GTFS
        env:
          VIC_OPENDATA_KEY: ${{ secrets.VIC_OPENDATA_KEY }}
        run: python build_timetable.py
      - name: Save if changed
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git add timetable.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update timetable"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
